<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Summary List
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="min-h-screen p-6">

    <div
        class="
            flex
            justify-between
            items-center
            mb-6
        "
    >
        <h1 class="text-3xl font-bold">
            Summary List
        </h1>

        <button
            id="backBtn"
            class="
                bg-blue-600
                text-white
                px-4
                py-2
                rounded
            "
        >
            Back
        </button>

    </div>

    <div
        class="
            bg-white
            rounded
            shadow
            p-4
        "
    >

        <table
            class="
                w-full
                border-collapse
                border
            "
        >

            <thead>

                <tr class="bg-gray-100">

                    <th class="border p-2">
                        Sl No
                    </th>

                    <th class="border p-2">
                        Call Type
                    </th>

                    <th class="border p-2">
                        Summary Text
                    </th>

                    <th class="border p-2">
                        Audio Summary
                    </th>

                </tr>

            </thead>

            <tbody
                id="summaryTableBody"
            >
            </tbody>

        </table>

        <div
            class="
                flex
                justify-center
                items-center
                gap-3
                mt-4
            "
        >

            <button
                id="prevBtn"
                class="
                    bg-gray-200
                    px-4
                    py-2
                    rounded
                "
            >
                Previous
            </button>

            <span
                id="pageInfo"
                class="font-semibold"
            >
                Page 1
            </span>

            <button
                id="nextBtn"
                class="
                    bg-gray-200
                    px-4
                    py-2
                    rounded
                "
            >
                Next
            </button>

        </div>

    </div>

</div>

<script src="/static/js/summaries.js"></script>

</body>
</html>
