<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Banking Call Analyzer
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="h-screen flex">

    <!-- LEFT PANEL -->

    <div class="w-[30%] bg-white border-r p-6 flex flex-col gap-4">

        <h1 class="text-2xl font-bold text-center">
            Banking Call Analyzer
        </h1>

        <input
            id="audioFile"
            type="file"
            class="border p-2 rounded"
        >
        <p class="text-xs text-gray-400">Supported: .wav, .mp3, .m4a</p>

        <button
            id="uploadBtn"
            class="bg-blue-600 text-white p-2 rounded"
        >
            Upload Audio
        </button>

        <button
            id="summaryBtn"
            class="bg-green-600 text-white p-2 rounded"
        >
            Generate Summary
        </button>
        <button
    id="summaryListBtn"
    class="bg-indigo-600 text-white p-2 rounded"
>
    Summary List
</button>

        <button
            id="transcriptBtn"
            class="bg-purple-600 text-white p-2 rounded"
        >
            View Transcript
        </button>

        <div
            id="status"
            class="text-sm text-gray-600"
        >
        </div>

    </div>

    <!-- RIGHT PANEL -->

<div class="w-[70%] flex flex-col h-screen">

    <!-- CHAT OUTPUT -->

    <div
        id="chatWindow"
        class="flex-1 overflow-y-auto p-6"
        style="display:flex; flex-direction:column; gap:12px;"
    >
    </div>

    <!-- SUMMARY LIST CONTAINER -->

    <div
        id="summaryContainer"
        class="hidden flex-1 overflow-y-auto p-6"
    >
    </div>

    <!-- INPUT -->

    <div class="bg-white border-t p-4 flex gap-2">

        <input
            id="questionInput"
            type="text"
            placeholder="Ask question about call..."
            class="flex-1 border rounded p-2"
        >

        <button
            id="askBtn"
            class="bg-blue-600 text-white px-4 rounded"
        >
            Send
        </button>

    </div>

</div>

</div>

<div
    id="summaryLoader"
    class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
>
    <div class="bg-white p-6 rounded-lg shadow-lg text-center">

        <div
            class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"
        ></div>

        <p class="text-gray-700 font-medium">
            Generating summary...
        </p>

    </div>
</div>

<script src="/static/js/app.js"></script>

</body>
</html>
